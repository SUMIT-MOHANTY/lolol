{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Calculator{% endblock %}</title>
    <!-- Bootstrap 5.3 CSS CDN with SRI integrity hash -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom Calculator Styles -->
    <link rel="stylesheet" href="{% static 'css/calculator.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <!-- Bootstrap 5.3 JS Bundle CDN with SRI integrity hash -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmDhiTeRxudkEu7KpZiMjyEon0HA" crossorigin="anonymous"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
